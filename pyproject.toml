[project]
name = "un-wpp"
version = "0.1.0"
description = "Reproducible collection of un-wpp"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.9"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
